version: "3.8"
services:
          app:
            build:
              args:
                user: hoadev
                uid: 1000
              context: ./
              dockerfile: Dockerfile.test
            image: skp
            container_name: skp-app
            restart: unless-stopped
            working_dir: /var/www/
            volumes:
              - ./:/var/www
            networks:
              - skp

          db:
            image: mysql:8.0
            container_name: skp-db
            restart: unless-stopped
            environment:
              MYSQL_DATABASE: ${DB_DATABASE}
              MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
              MYSQL_PASSWORD: ${DB_PASSWORD}
              MYSQL_USER: ${DB_USERNAME}
              SERVICE_TAGS: dev
              SERVICE_NAME: mysql
            volumes:
              - ./docker-compose/sql:/docker-entrypoint-initdb.d
            networks:
              - skp
          adminer:
           image: adminer
           restart: always
           ports:
              - 8080:8080
           networks:
              - skp

          nginx:
            image: nginx:alpine
            container_name: skp-nginx
            restart: unless-stopped
            ports:
              - 8000:80
            volumes:
              - ./:/var/www
              - ./docker-compose/nginx:/etc/nginx/conf.d/
            networks:
              - skp
networks:
      skp:
        driver: bridge
